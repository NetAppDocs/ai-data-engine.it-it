indexpage:
  title: Documentazione di AI Data Engine
  summary: La documentazione di AI Data Engine illustra come implementare, connettere
    le origini dati e utilizzare AI Data Engine per l'ottimizzazione dello storage,
    l'analisi dei metadati, la governance dei dati e l'accesso controllato all'IA
    tramite MCP.
  keywords: ai data engine, aide, storage optimization, investigation, policies, data
    governance, NetApp Console, governed ai access, mcp, model context protocol
  lead: AI Data Engine è un servizio di intelligence dei metadati, gestito tramite
    NetApp Console, che analizza i sistemi connessi, crea un catalogo di metadati
    e ti offre visibilità e strumenti per ottimizzare lo storage e governare i dati
    su larga scala. Grazie all'accesso AI controllato, i client AI possono cercare
    in quei metadati tramite il Model Context Protocol (MCP).
